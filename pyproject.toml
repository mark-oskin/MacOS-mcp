[project]
name = "macos-native-mcp"
version = "0.1.0"
description = "MCP server for driving macOS apps (Mail via AppleScript)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
macos-native-mcp = "macos_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
macos_mcp = ["*.applescript"]
